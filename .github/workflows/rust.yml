name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up JBang
      uses: jbangdev/setup-jbang@main
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: |
        cargo test --workspace --verbose
        cargo test -p serde-java --lib testkit::tests -- --ignored
