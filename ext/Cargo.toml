[package]
name = "serde-java-ext"
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"
authors = ["Jeffsky Tsai <jjeffcaii@outlook.com>"]
repository = "https://github.com/jjeffcaii/serde-java"
description = "Pre-built Java serialization support for common JDK types."
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "LICENSE",
]

[dependencies]
serde-java = { version = "0.0.4", path = ".." }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
log = "0.4"
pretty_env_logger = "0.5"
hex = "0.4"
anyhow = "1.0"
serde_json = "1.0"
