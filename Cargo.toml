[workspace]
members = ["derive", "ext"]

[package]
name = "serde-java"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
authors = ["Jeffsky Tsai <jjeffcaii@outlook.com>"]
repository = "https://github.com/jjeffcaii/serde-java"
homepage = "https://github.com/jjeffcaii/serde-java"
description = "A Rust implementation of the Java Serialization."
include = [
    "src/**/*.rs",
    "build.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "README.md",
]

[build-dependencies]
string_cache_codegen = "0.7"

[dependencies]
log = "0.4"
thiserror = "2.0"
anyhow = "1.0"
once_cell = "1"
hashbrown = "0.17"
byteorder = "1.5"
string_cache = "0.10"
bitflags = "2.13"
smallvec = { version = "1.15", features = ["write"] }
sha1 = "0.11"
serde-java-derive = { version = "0.0.1", path = "derive", optional = true }

[dev-dependencies]
pretty_env_logger = "0.5"
hex = "0.4"

[features]
default = ["derive"]
derive = ["dep:serde-java-derive"]

[[example]]
name = "example_derive"
required-features = ["derive"]
